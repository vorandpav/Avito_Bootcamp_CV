[project]
name = "avito-bootcamp-cv"
version = "0.1.0"
description = "Text orientation classification (0 vs 180 degrees)"
readme = "README.md"
authors = [
    { name = "vorobev andrej", email = "vorandpav@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=9.5.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "scikit-learn>=1.2.0",
    "tqdm>=4.65.0",
    "albumentations>=1.3.0",
    "kagglehub>=0.2.0",
    "opencv-python>=4.7.0",
    "gdown>=4.7.0",
    "trdg",
    "setuptools<81",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
trdg = { git = "https://github.com/Belval/TextRecognitionDataGenerator.git" }
