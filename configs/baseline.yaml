experiment:
  name: "baseline"
  trainer: "baseline"
  seed: 42

data:
  num_workers: 2
  raw_dir: "data/raw"
  processed_dir: "data/processed"

  rustitw_gdrive_id: "1vpDbEpcEOJQDo69S-KP9myssM_VWdlx9"
  rustitw_target_max_crops: 35000

  hiertext_annotation_url: "https://raw.githubusercontent.com/google-research-datasets/hiertext/70b6620b2b112597d8219e11eee9773a1403827c/gt/validation.jsonl.gz"
  hiertext_archive_url: "https://open-images-dataset.s3.amazonaws.com/ocr/validation.tgz"
  hiertext_target_max_crops: 35000

  sources:
    synthetic_crops:
      enabled: true
      max_samples: 20000

    rustitw_crops:
      enabled: true
      max_samples: 35000

    hiertext_crops:
      enabled: true
      max_samples: 35000

  split:
    train_ratio: 0.8
    validation_ratio: 0.1
    test_ratio: 0.1

synthetic:
  train_samples: 2048
  validation_samples: 512
  languages: [ "ru", "en" ]
  font_assets_dir: "assets/fonts"
  min_font_size: 16
  max_font_size: 48

model:
  name: "mobilenet_v3_large"
  pretrained: true
  input_height: 96
  input_width: 384
  dropout: 0.2

training:
  batch_size: 32
  frozen_epochs: 2
  finetune_epochs: 10
  frozen_learning_rate: 0.001
  finetune_learning_rate: 0.0001
  weight_decay: 0.01